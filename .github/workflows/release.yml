name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: jrawr

      - name: Build and package
        working-directory: jrawr
        run: ./gradlew clean build release -Pjrawr.version="${GITHUB_REF_NAME#v}"

      - name: Verify archives
        working-directory: jrawr/build/release
        run: |
          sha256sum -c ./*.sha256
          unzip -l JRawr-*.zip
          tar -tzf JRawr-*.tar.gz

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            jrawr/build/release/JRawr-*.zip \
            jrawr/build/release/JRawr-*.zip.sha256 \
            jrawr/build/release/JRawr-*.tar.gz \
            jrawr/build/release/JRawr-*.tar.gz.sha256 \
            --title "JRawr ${GITHUB_REF_NAME#v}" \
            --generate-notes
