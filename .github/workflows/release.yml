name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v1.0.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and package
        working-directory: jrawr
        run: ./gradlew clean build release releaseBundled -Pjrawr.version="${{ steps.release.outputs.version }}"

      - name: Verify archives
        working-directory: jrawr/build/release
        run: |
          sha256sum -c ./*.sha256
          for archive in JRawr-*.zip; do unzip -l "$archive"; done
          for archive in JRawr-*.tar.gz; do tar -tzf "$archive"; done

      - name: Smoke-test bundled Linux archive
        working-directory: jrawr
        run: |
          rm -rf /tmp/jrawr-smoke
          mkdir -p /tmp/jrawr-smoke/extract /tmp/jrawr-smoke/user
          unzip -q build/release/JRawr-*-linux-x64.zip -d /tmp/jrawr-smoke/extract
          APP=$(find /tmp/jrawr-smoke/extract -mindepth 1 -maxdepth 1 -type d | head -1)
          XDG_DATA_HOME=/tmp/jrawr-smoke/user JRAWR_PORT=18080 "$APP/jrawr.sh" \
            > /tmp/jrawr-smoke/app.log 2>&1 &
          PID=$!
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:18080/
          EXPECTED_JAVA=$(grep '^temurin.version=' gradle/temurin.properties | cut -d= -f2 | cut -d+ -f1)
          grep -q "using Java $EXPECTED_JAVA" /tmp/jrawr-smoke/app.log
          kill "$PID"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            jrawr/build/release/JRawr-*.zip \
            jrawr/build/release/JRawr-*.zip.sha256 \
            jrawr/build/release/JRawr-*.tar.gz \
            jrawr/build/release/JRawr-*.tar.gz.sha256 \
            --title "JRawr ${{ steps.release.outputs.version }}" \
            --generate-notes
