spring.application.name=rawr-web
server.port=8080

# Game-data directory loaded at startup (item/buff/enchant/source/filter caches). Relative to the
# working directory; bootRun runs from jrawr/ so the default resolves to jrawr/data. Ship that
# directory next to the application and point this property at it.
jrawr.data-dir=data

# Directory for saved characters (original Rawr XML), relative to the working directory; created on
# demand by CharacterStore. jrawr-web tests override it with a temp directory.
jrawr.characters-dir=characters

# Side-car store for items fetched at runtime by ID (DECISIONS #31/#55). Left empty the store lives
# in "jrawr.items.xml" next to jrawr.characters-dir; only user-added items are written, never the
# legacy ItemCache.xml. Created on demand on the first Add-by-ID.
jrawr.items-file=

# Fallback site base for item icons (Rawr ships no images). The host layout map (ItemIconService)
# turns it into a full icon URL. Icons are always hotlinked from that site in the browser; JRawr
# does not download or store copies.
jrawr.icon-base-url=https://wow.zamimg.com

# Character XML uploads (JRawr format). The importer enforces the same 10 MB per-session cap;
# anything larger is rejected with a toast, not a 500.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Development: never cache templates/static assets, so a refresh always picks up UI changes.
# Override both to true/positive values for a production deployment.
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
